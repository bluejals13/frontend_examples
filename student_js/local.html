<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>학생 관리 시스템</title>

    <link rel="stylesheet" href="./css/form.css" />
</head>

<body>

    <h1>학생 관리 시스템</h1>


    <!-- =========================
         학생 등록 / 수정
    ========================== -->

    <div class="form-container">

        <h2 id="formTitle">학생 등록</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId" name="studentId" />

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">이름:</label>
                    <input type="text" name="name" id="name" />
                </div>

                <div class="form-group">
                    <label for="studentNumber">학번:</label>
                    <input
                        type="text"
                        name="studentNumber"
                        id="studentNumber"
                    />
                </div>

                <div class="form-group">
                    <label for="address">주소:</label>
                    <input
                        type="text"
                        name="address"
                        id="address"
                    />
                </div>

                <div class="form-group">
                    <label for="phoneNumber">전화번호:</label>
                    <input
                        type="text"
                        name="phoneNumber"
                        id="phoneNumber"
                        placeholder="010-0000-0000"
                        pattern="[0-9]{2,3}-[0-9]{3,4}-[0-9]{4}"
                    />
                </div>

                <div class="form-group">
                    <label for="email">이메일:</label>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="example@test.com"
                    />
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">생년월일:</label>
                    <input
                        type="date"
                        name="dateOfBirth"
                        id="dateOfBirth"
                    />
                </div>

                <div class="button-group">

                    <button type="submit" id="submitButton">
                        학생 등록
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="cancel-btn"
                        style="display: none;"
                    >
                        취소
                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- =========================
         학생 조회
    ========================== -->

    <div class="search-container">

        <h2>학생 조회</h2>

        <div class="search-group">

            <select id="searchType">

                <option value="all">
                    전체 조회
                </option>

                <option value="id">
                    ID로 조회
                </option>

                <option value="studentNumber">
                    학번으로 조회
                </option>

            </select>


            <input
                type="text"
                id="searchKeyword"
                placeholder="조회할 값을 입력하세요"
            />


            <button
                type="button"
                id="searchButton"
            >
                조회
            </button>


            <button
                type="button"
                id="resetSearchButton"
            >
                전체 조회
            </button>

        </div>

    </div>


    <!-- =========================
         학생 목록
    ========================== -->

    <div class="table-container">

        <h2>학생 목록</h2>

        <table>

            <thead>

                <tr>
                    <th>이름</th>
                    <th>학번</th>
                    <th>주소</th>
                    <th>전화번호</th>
                    <th>이메일</th>
                    <th>생년월일</th>
                    <th>액션</th>
                </tr>

            </thead>

            <tbody id="studentTableBody">
            </tbody>

        </table>

    </div>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="./js/api.js"></script>
    <script src="./js/form.js"></script>
    <script src="./js/search.js"></script>

</body>

</html>
